<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050606" />
    <script>
      // Start fetching the hero background for the visitor's theme before CSS
      // is parsed, and hide the prerendered light theme until hydration applies
      // a stored or system dark theme, so dark-theme visitors see no light flash.
      (function () {
        var dark = false;
        try {
          var mode = window.localStorage.getItem("planban-public-theme");
          dark = mode === "dark" || (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (error) {}
        var root = document.documentElement;
        if (window.location.pathname === "/" || window.location.pathname === "/index.html") {
          var preload = document.createElement("link");
          preload.rel = "preload";
          preload.as = "image";
          preload.href = "/assets/ultramock-bg/planban-bg-hero-codex-field-codexgradient-" + (dark ? "dark" : "light") + "-16x9.jpg";
          document.head.appendChild(preload);
        }
        if (!dark) return;
        root.classList.add("pb-theme-pending");
        window.setTimeout(function () { root.classList.remove("pb-theme-pending"); }, 4000);
      })();
    </script>
    <style>
      html.pb-theme-pending { background: #050606; }
      html.pb-theme-pending body { visibility: hidden; }
      html.pb-theme-pending .pb-site.light .pb-hero-media { background-image: none; }
    </style>
    <!--app-head-->
    <link rel="icon" type="image/svg+xml" href="/assets/card-stack-black.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/assets/card-stack-white.svg" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/entry-client.tsx"></script>
  </body>
</html>
